name: apiverve_carmodels
description: "US Car Models is a car make and model API for vehicles sold in the United States from 1984 to present. List models by make on any plan, while paid plans add year filters, trims, fuel economy (MPG), engine details, and transmission specifications."
version: 1.2.3
homepage: https://apiverve.com/marketplace/carmodels?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/carmodels-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
